# Full verification pipeline for the monorepo: lint, types, tests, build, and an
# export smoke test for the publishable package, plus the FastAPI backend tests.
# Lint also runs standalone in eslint.yml; it is repeated here so this workflow is
# a complete, self-contained gate for a release.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint

      - name: Type-check
        run: pnpm exec turbo run check-types

      - name: Component package tests
        run: pnpm --filter @zentauri-ui/zentauri-components test

      - name: Docs app tests
        run: pnpm --filter component-library test

      - name: Package health docs are in sync
        run: |
          pnpm --filter @zentauri-ui/zentauri-components update:test-health
          git diff --exit-code \
            packages/components/README.md \
            apps/component-library/README.md \
            apps/component-library/components/home/marketing/package-health-data.ts \
            || (echo "::error::Package health data is stale. Run 'pnpm update:test-health' and commit." && exit 1)

      - name: Build
        run: pnpm exec turbo run build

      - name: Regenerate registry (must be in sync)
        run: |
          pnpm --filter @zentauri-ui/zentauri-components generate:registry
          git diff --exit-code packages/components/cli/registry.json \
            || (echo "::error::cli/registry.json is stale. Run 'pnpm --filter @zentauri-ui/zentauri-components generate:registry' and commit." && exit 1)

      - name: Export smoke test
        run: pnpm --filter @zentauri-ui/zentauri-components check:exports

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/zentauri-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest
